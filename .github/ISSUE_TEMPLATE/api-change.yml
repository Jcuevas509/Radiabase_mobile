name: API change
description: Request a new or changed field-map / lead API route. You do not need the Nest repo.
title: "[API] "
labels: ["needs-api"]
body:
  - type: markdown
    attributes:
      value: |
        Staging is `https://sunnected-jose-1.onrender.com/api`.
        Existing routes: [docs/backend-routes.md](https://github.com/Jcuevas509/Radiabase_mobile/blob/main/docs/backend-routes.md).
        Do not ask for the Nest repo, database URLs, or env files.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New route
        - Change an existing route or filter
        - Bug on staging
        - Question only
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Method and path
      description: Example — GET /area-management/map-houses
      placeholder: GET /area-management/map-houses
    validations:
      required: true
  - type: textarea
    id: filters
    attributes:
      label: Query params, body, or filters
      description: List each field, type, and whether it is required.
      placeholder: |
        areaIds: comma-separated numbers, optional
        status: interested | not_home | not_interested, optional
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example request and expected response
      placeholder: |
        GET /area-management/map-houses?status=not_home&west=...
        → 200 array of houses, only not_home in the bbox
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: App screen this is for
      placeholder: Field map house sheet
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What the tester or rep cannot do today.
    validations:
      required: true
